<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitTrack Mobile App</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ec4899;
      --primary-dark: #be185d;
      --primary-soft: #fdf2f8;
      --success: #10b981;
      --ink: #0f172a;
      --ink-muted: #64748b;
      --bg: #090514;
      --card: #160f29;
      --border: #2c1e4d;
      --radius: 16px;
      --font: 'DM Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: #f1f5f9;
      padding: 16px;
      font-size: 13px;
      line-height: 1.4;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .logo {
      font-weight: 700;
      font-size: 15px;
      color: var(--primary);
    }
    .status-pill {
      background: rgba(236,72,153,0.15);
      color: #f472b6;
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 100px;
    }
    .main-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 8px solid var(--border);
      border-top-color: var(--primary);
      margin: 10px auto 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .circle-val {
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
    }
    .circle-lbl {
      font-size: 10px;
      color: var(--ink-muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      text-align: center;
    }
    .sc-val { font-size: 18px; font-weight: 700; color: #fff; }
    .sc-lbl { font-size: 10px; color: var(--ink-muted); margin-top: 2px; }
    
    .btn-workout {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 100px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      font-family: var(--font);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, transform 0.1s;
      width: 100%;
      box-shadow: 0 4px 14px rgba(236,72,153,0.3);
    }
    .btn-workout:active { transform: scale(0.98); }
    .btn-workout.active {
      background: #dc2626;
      box-shadow: 0 4px 14px rgba(220,38,38,0.3);
    }
    
    .timer-display {
      font-family: monospace;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      margin-top: 12px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">⚡ FitTrack Pro</div>
    <div class="status-pill">Connected</div>
  </header>

  <div class="main-circle">
    <div class="circle-val" id="stepCount">6,482</div>
    <div class="circle-lbl">Steps</div>
  </div>

  <div class="grid-2">
    <div class="stat-card">
      <div class="sc-val">342</div>
      <div class="sc-lbl">Kcal Burned</div>
    </div>
    <div class="stat-card">
      <div class="sc-val">45 <span style="font-size:11px;color:var(--ink-muted);">min</span></div>
      <div class="sc-lbl">Active Time</div>
    </div>
  </div>

  <div style="flex:1; display:flex; flex-direction:column; justify-content:flex-end;">
    <button class="btn-workout" id="workoutBtn" onclick="toggleWorkout()">
      <span>🏃‍♂️</span> <span id="btnText">Start Active Run</span>
    </button>
    <div class="timer-display" id="timer">00:00</div>
  </div>

  <script>
    let timerInterval = null;
    let seconds = 0;
    let isRunning = false;
    let steps = 6482;

    // Simulate steps increasing
    setInterval(() => {
      if (isRunning) {
        steps += Math.floor(Math.random() * 4) + 1;
        document.getElementById('stepCount').textContent = steps.toLocaleString();
      }
    }, 2000);

    function toggleWorkout() {
      const btn = document.getElementById('workoutBtn');
      const text = document.getElementById('btnText');
      const timer = document.getElementById('timer');
      
      isRunning = !isRunning;
      
      if (isRunning) {
        btn.classList.add('active');
        text.textContent = "Pause Workout";
        timer.style.display = 'block';
        
        timerInterval = setInterval(() => {
          seconds++;
          const min = Math.floor(seconds / 60).toString().padStart(2, '0');
          const sec = (seconds % 60).toString().padStart(2, '0');
          timer.textContent = `${min}:${sec}`;
        }, 1000);
      } else {
        btn.classList.remove('active');
        text.textContent = "Resume Workout";
        clearInterval(timerInterval);
      }
    }
  </script>
</body>
</html>
