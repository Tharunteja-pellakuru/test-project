<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Client Showcase</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Split Screen Container */
        .showcase-container {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* LEFT SIDE: 3D Canvas for Logo */
        .left-side {
            width: 50%;
            height: 100%;
            position: relative;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
        }

        /* RIGHT SIDE: Typography / Details Column */
        .right-side {
            width: 50%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 10%;
            padding-right: 15%;
            background: #ffffff;
            position: relative;
            z-index: 10;
        }

        /* Dynamic Info Card */
        .info-panel {
            max-width: 420px;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }
        .info-panel.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .info-panel h2 {
            font-size: 36px;
            font-weight: 700;
            color: #111111;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }
        .info-panel p {
            font-size: 16px;
            color: #555555;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .meta-group {
            display: flex;
            gap: 40px;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            padding-top: 20px;
        }
        .meta-item span {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            color: #999999;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .meta-item strong {
            font-size: 14px;
            color: #222222;
            font-weight: 600;
        }

        /* Scroll indicator fixed center-bottom */
        .scroll-hint {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #aaaaaa;
            pointer-events: none;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.3; transform: translate(-50%, 0); }
            50% { opacity: 1; transform: translate(-50%, 4px); }
            100% { opacity: 0.3; transform: translate(-50%, 0); }
        }
    </style>
</head>
<body>

    <div class="showcase-container">
        <div class="left-side">
            <div id="canvas-container"></div>
        </div>

        <div class="right-side">
            <div class="info-panel" id="infoPanel">
                <h2 id="clientName">Client Name</h2>
                <p id="clientDesc">Project description goes here detailing the creative scope and execution.</p>
                <div class="meta-group">
                    <div class="meta-item">
                        <span>Services</span>
                        <strong id="clientServices">Development</strong>
                    </div>
                    <div class="meta-item">
                        <span>Year</span>
                        <strong id="clientYear">2026</strong>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="scroll-hint">Scroll Mouse to Explore</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
        // --- 1. Client Portfolio Data Array ---
        const clientsData = [
            {
                name: "Aether Dynamics",
                logoUrl: "https://via.placeholder.com/512/000000/ffffff?text=Aether", 
                desc: "Re-architecting global web logistics systems for real-time freight and cargo visualization streams.",
                services: "Web3 App / UX UI",
                year: "2026"
            },
            {
                name: "Spectra Global",
                logoUrl: "https://via.placeholder.com/512/000000/ffffff?text=Spectra",
                desc: "Engineered high-performance data pipelines managing visual assets natively for next-gen enterprises.",
                services: "Cloud Infrastructure",
                year: "2025"
            },
            {
                name: "Novus AI",
                logoUrl: "https://via.placeholder.com/512/000000/ffffff?text=Novus",
                desc: "Brand refresh and design system framework creation for scalable machine learning API interfaces.",
                services: "Design System",
                year: "2026"
            }
        ];

        // --- 2. 3D Space Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff); // Crisp clean white backdrop
        scene.fog = new THREE.FogExp2(0xffffff, 0.025); 

        // Targeted side aspect ratio framing
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- 3. Studio Studio Lighting Matrix ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);

        const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
        keyLight.position.set(5, 10, 8);
        scene.add(keyLight);

        // --- 4. Isolated Logo Mesh Generation ---
        const textureLoader = new THREE.TextureLoader();
        const logos = [];
        const gapBetweenStations = 30; // Z-interval spacing configuration
        let currentIdx = 0;
        let isMoving = false;

        function buildLogoStation(zPos, logoSrc) {
            const logoGeo = new THREE.PlaneGeometry(5, 5);
            const logoMat = new THREE.MeshBasicMaterial({
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0 // Will fade in beautifully upon mount
            });

            textureLoader.load(logoSrc, (tex) => {
                logoMat.map = tex;
                logoMat.opacity = 1;
                logoMat.needsUpdate = true;
            });

            const logoMesh = new THREE.Mesh(logoGeo, logoMat);
            logoMesh.position.set(0, 0, zPos);
            scene.add(logoMesh);

            return logoMesh;
        }

        // Initialize and distribute logos on the pipeline line
        clientsData.forEach((client, idx) => {
            logos.push(buildLogoStation(-idx * gapBetweenStations, client.logoUrl));
        });

        // Set Camera home location position
        camera.position.set(0, 0, 8);

        // --- 5. Data Card Content Refresher ---
        function updateDataCard(idx) {
            const panel = document.getElementById('infoPanel');
            panel.classList.remove('active'); 

            setTimeout(() => {
                document.getElementById('clientName').innerText = clientsData[idx].name;
                document.getElementById('clientDesc').innerText = clientsData[idx].desc;
                document.getElementById('clientServices').innerText = clientsData[idx].services;
                document.getElementById('clientYear').innerText = clientsData[idx].year;
                panel.classList.add('active');
            }, 400);
        }

        // Initialize display configuration state
        updateDataCard(0);

        // --- 6. Fluid Transition Camera Control ---
        function slideToStation(targetIdx) {
            if (isMoving || targetIdx < 0 || targetIdx >= logos.length) return;
            isMoving = true;

            const targetZ = -targetIdx * gapBetweenStations;
            const flightTime = 1.6;

            // Direct flight camera tracking interpolation routines
            gsap.to(camera.position, {
                z: targetZ + 8,
                duration: flightTime,
                ease: "power4.inOut",
                onComplete: () => {
                    currentIdx = targetIdx;
                    isMoving = false;
                }
            });

            // Smooth scale reveal pop on the targeted upcoming logo element
            const targetLogo = logos[targetIdx];
            gsap.fromTo(targetLogo.scale,
                { x: 0.5, y: 0.5 },
                { x: 1, y: 1, duration: flightTime, ease: "power3.out" }
            );

            updateDataCard(targetIdx);
        }

        // --- 7. Mouse Scroll Interceptor Engine ---
        window.addEventListener('wheel', (event) => {
            if (isMoving) return; 

            if (event.deltaY > 0) {
                if (currentIdx < clientsData.length - 1) {
                    slideToStation(currentIdx + 1);
                }
            } else if (event.deltaY < 0) {
                if (currentIdx > 0) {
                    slideToStation(currentIdx - 1);
                }
            }
        }, { passive: true });

        // Screen Resize Adjustment Handler
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // --- 8. Animation Canvas Loop ---
        function tick() {
            requestAnimationFrame(tick);

            // Subtle dynamic idling loop so things feel alive
            logos.forEach((logo, i) => {
                if(i === currentIdx) {
                    logo.rotation.y = Math.sin(Date.now() * 0.001) * 0.08;
                }
            });

            renderer.render(scene, camera);
        }

        tick();
    </script>
</body>
</html>
