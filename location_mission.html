<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mission Control — eParivartan Location</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- GSAP for scroll animations -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<!-- Leaflet.js for Real Map -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
/* ═══════════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════════ */
:root {
  --mc-bg:       #ffffff;
  --mc-grid:     rgba(45, 158, 82, 0.04);
  --mc-green:    #2d9e52;
  --mc-green-light: rgba(45, 158, 82, 0.12);
  --mc-green-glow: rgba(45, 158, 82, 0.3);
  
  --mc-ink:      #0f172a;
  --mc-ink-2:    #334155;
  --mc-ink-3:    #64748b;
  --mc-ink-4:    #94a3b8;
  
  --mc-glass:    rgba(255, 255, 255, 0.65);
  --mc-border:   rgba(45, 158, 82, 0.15);
  --mc-shadow:   0 12px 40px -12px rgba(15, 23, 42, 0.08);
  --mc-shadow-g: 0 8px 32px -8px var(--mc-green-glow);
  
  --ease-spring: cubic-bezier(0.34, 1.15, 0.64, 1);
  --font-sans:   'Inter', -apple-system, sans-serif;
  --font-mono:   'JetBrains Mono', monospace;
}

/* ═══════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════ */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--mc-bg);
  color: var(--mc-ink);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ═══════════════════════════════════════════
   SECTION WRAPPER & GRID BACKGROUND
═══════════════════════════════════════════ */
.mission-section {
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: center;
  padding: 80px 40px;
  overflow: hidden;
}

/* Floating Grid Lines */
.mission-section::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: 
    linear-gradient(var(--mc-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--mc-grid) 1px, transparent 1px);
  background-size: 60px 60px;
  background-position: center center;
  z-index: 0;
  perspective: 1000px;
  /* Subtle float animation for the grid */
  animation: floatGrid 20s linear infinite;
}
@keyframes floatGrid {
  0% { transform: translateY(0); }
  100% { transform: translateY(60px); }
}

/* Subtle Vignette / Lighting */
.mission-light {
  position: absolute;
  top: 50%;
  left: 30%;
  transform: translate(-50%, -50%);
  width: 800px;
  height: 800px;
  background: radial-gradient(circle, var(--mc-green-light) 0%, transparent 60%);
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
}

/* ═══════════════════════════════════════════
   LAYOUT
═══════════════════════════════════════════ */
.mc-container {
  max-width: 1320px;
  margin: 0 auto;
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: 1fr 1fr 1.2fr; /* Radar | Beacon | Info */
  gap: 40px;
  align-items: center;
  width: 100%;
}
@media (max-width: 1100px) {
  .mc-container { grid-template-columns: 1fr 1fr; }
  .mc-radar-wrap { display: none; } /* Hide radar on medium screens for space */
}
@media (max-width: 800px) {
  .mc-container { grid-template-columns: 1fr; gap: 60px; }
  .mc-radar-wrap { display: flex; }
}

/* ═══════════════════════════════════════════
   LEFT: RADAR VISUALIZATION
═══════════════════════════════════════════ */
.mc-radar-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  max-width: 320px;
  margin: 0 auto;
  display: flex;
  justify-content: center;
  align-items: center;
}

.radar-base {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 1px solid var(--mc-border);
  background: rgba(255, 255, 255, 0.8);
  backdrop-filter: blur(8px);
  box-shadow: inset 0 0 40px rgba(45, 158, 82, 0.05);
  overflow: hidden;
  /* Ensure child map gets clipped to circle */
  -webkit-mask-image: -webkit-radial-gradient(white, black);
}

#radar-map {
  position: absolute;
  inset: -10px; /* Slight bleed to avoid edge gaps */
  filter: grayscale(100%) contrast(120%) opacity(0.35);
  z-index: 0;
  pointer-events: none; /* Let radar UI handle interactions if any */
}

/* Ensure UI elements sit above the map */
.radar-ring, .radar-crosshair, .radar-sweep, .radar-blip {
  z-index: 1;
}

/* Concentric rings */
.radar-ring {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 1px solid var(--mc-border);
}
.radar-ring:nth-child(1) { width: 33%; height: 33%; }
.radar-ring:nth-child(2) { width: 66%; height: 66%; }
.radar-ring:nth-child(3) { width: 100%; height: 100%; }

/* Crosshairs */
.radar-crosshair {
  position: absolute;
  background: var(--mc-border);
}
.radar-crosshair.h { top: 50%; left: 0; width: 100%; height: 1px; }
.radar-crosshair.v { left: 50%; top: 0; height: 100%; width: 1px; }

/* Sweeping Scanner */
.radar-sweep {
  position: absolute;
  top: 50%; left: 50%;
  width: 50%; height: 50%;
  transform-origin: 0 0;
  background: conic-gradient(from 0deg, var(--mc-green-glow) 0deg, transparent 60deg);
  animation: scan 4s linear infinite;
  border-left: 2px solid var(--mc-green);
}
@keyframes scan {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* Blips */
.radar-blip {
  position: absolute;
  width: 6px;
  height: 6px;
  background: var(--mc-green);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--mc-green);
  opacity: 0;
  animation: blipFade 4s ease-out infinite;
}
.radar-blip.b1 { top: 30%; left: 60%; animation-delay: 0.5s; }
.radar-blip.b2 { top: 70%; left: 40%; animation-delay: 2.2s; }
.radar-blip.b3 { top: 40%; left: 20%; animation-delay: 3.1s; }

@keyframes blipFade {
  0% { opacity: 1; transform: scale(1); }
  20% { opacity: 1; transform: scale(1.5); }
  100% { opacity: 0; transform: scale(0.5); }
}

/* Floating coordinates */
.coord-float {
  position: absolute;
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--mc-green);
  font-weight: 500;
  background: rgba(255,255,255,0.8);
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid var(--mc-border);
}
.coord-float.c1 { bottom: -10px; left: -20px; }
.coord-float.c2 { top: 20px; right: -40px; }

/* ═══════════════════════════════════════════
   CENTER: PULSING BEACON
═══════════════════════════════════════════ */
.mc-beacon-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  height: 100%;
}

.beacon-core {
  position: relative;
  width: 24px;
  height: 24px;
  background: var(--mc-green);
  border-radius: 50%;
  box-shadow: 0 0 20px var(--mc-green-glow);
  z-index: 2;
}

.beacon-ring {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 24px; height: 24px;
  border: 2px solid var(--mc-green);
  border-radius: 50%;
  animation: pulseRing 3s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
}
.beacon-ring:nth-child(2) { animation-delay: 1s; }
.beacon-ring:nth-child(3) { animation-delay: 2s; }

@keyframes pulseRing {
  0% { width: 24px; height: 24px; opacity: 1; border-width: 2px; }
  100% { width: 250px; height: 250px; opacity: 0; border-width: 0.5px; }
}

.beacon-label {
  margin-top: 32px;
  font-family: var(--font-mono);
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--mc-ink-2);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  background: var(--mc-glass);
  padding: 6px 14px;
  border-radius: 100px;
  border: 1px solid var(--mc-border);
  backdrop-filter: blur(10px);
}

/* Particles around beacon */
.particle {
  position: absolute;
  width: 4px; height: 4px;
  background: var(--mc-ink-4);
  border-radius: 50%;
  top: 50%; left: 50%;
  opacity: 0.5;
}
/* (Will be animated via GSAP) */

/* ═══════════════════════════════════════════
   RIGHT: INFO PANEL
═══════════════════════════════════════════ */
.mc-info-panel {
  background: var(--mc-glass);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--mc-border);
  border-radius: 24px;
  padding: 40px;
  box-shadow: var(--mc-shadow);
  position: relative;
  overflow: hidden;
}

/* Subtle inner glow */
.mc-info-panel::before {
  content: '';
  position: absolute;
  top: 0; left: 0; width: 100%; height: 4px;
  background: linear-gradient(90deg, transparent, var(--mc-green), transparent);
  opacity: 0.5;
}

.panel-header {
  margin-bottom: 32px;
}
.ph-eyebrow {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--mc-green);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 8px;
  display: block;
}
.ph-title {
  font-size: 2.2rem;
  font-weight: 700;
  color: var(--mc-ink);
  letter-spacing: -0.03em;
  line-height: 1.1;
}

/* Data List */
.data-list {
  display: flex;
  flex-direction: column;
  gap: 20px;
  margin-bottom: 40px;
}
.data-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 16px;
  border-bottom: 1px solid rgba(15,23,42,0.06);
}
.data-item:last-child {
  border-bottom: none;
  padding-bottom: 0;
}

.di-label {
  font-size: 0.85rem;
  color: var(--mc-ink-3);
  font-weight: 500;
}
.di-value {
  font-size: 0.95rem;
  color: var(--mc-ink);
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Status Indicator */
.status-dot {
  width: 8px; height: 8px;
  background: var(--mc-green);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--mc-green);
  animation: blink 2s infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* Monospace numbers */
.num-counter {
  font-family: var(--font-mono);
  font-weight: 600;
  letter-spacing: -0.05em;
  color: var(--mc-green);
}

/* CTA Button */
.btn-launch {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 16px 24px;
  background: var(--mc-ink);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-family: var(--font-sans);
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s var(--ease-spring);
  position: relative;
  overflow: hidden;
  text-decoration: none;
}
.btn-launch::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  transition: transform 0.6s ease;
}
.btn-launch:hover {
  background: var(--mc-green);
  transform: translateY(-2px);
  box-shadow: var(--mc-shadow-g);
}
.btn-launch:hover::before {
  transform: translateX(200%);
}
.btn-launch svg {
  transition: transform 0.3s var(--ease-spring);
}
.btn-launch:hover svg {
  transform: translateX(4px) translateY(-4px);
}

/* ═══════════════════════════════════════════
   RESPONSIVE OVERRIDES
═══════════════════════════════════════════ */
@media (max-width: 600px) {
  .mission-section { padding: 60px 20px; }
  .mc-info-panel { padding: 30px 20px; }
  .ph-title { font-size: 1.8rem; }
  .radar-base { max-width: 260px; }
}
</style>
</head>
<body>

<section class="mission-section">
  <div class="mission-light"></div>
  
  <div class="mc-container">
    
    <!-- LEFT: RADAR -->
    <div class="mc-radar-wrap gs-reveal">
      <div class="radar-base">
        <!-- Real Geographic Map inside Radar -->
        <div id="radar-map"></div>
        
        <div class="radar-ring"></div>
        <div class="radar-ring"></div>
        <div class="radar-ring"></div>
        <div class="radar-crosshair h"></div>
        <div class="radar-crosshair v"></div>
        
        <div class="radar-sweep"></div>
        
        <div class="radar-blip b1"></div>
        <div class="radar-blip b2"></div>
        <div class="radar-blip b3"></div>
      </div>
      
      <div class="coord-float c1">LAT: 17.4317° N</div>
      <div class="coord-float c2">LNG: 78.4067° E</div>
    </div>
    
    <!-- CENTER: BEACON -->
    <div class="mc-beacon-wrap gs-reveal delay-1">
      <div class="beacon-ring"></div>
      <div class="beacon-ring"></div>
      <div class="beacon-ring"></div>
      <div class="beacon-core"></div>
      
      <!-- Generated particles will go here via JS -->
      <div id="particle-container"></div>
      
      <div class="beacon-label">HQ — HYDERABAD</div>
    </div>
    
    <!-- RIGHT: INFO PANEL -->
    <div class="mc-info-panel gs-reveal delay-2">
      <div class="panel-header">
        <span class="ph-eyebrow">Location Intelligence</span>
        <h2 class="ph-title">Mission Control</h2>
      </div>
      
      <div class="data-list">
        <div class="data-item">
          <span class="di-label">Mission Status</span>
          <span class="di-value"><div class="status-dot"></div> Online</span>
        </div>
        <div class="data-item">
          <span class="di-label">Location</span>
          <span class="di-value">Hyderabad, India</span>
        </div>
        <div class="data-item">
          <span class="di-label">Projects Delivered</span>
          <span class="di-value"><span class="num-counter" id="counter-projects">0</span>+</span>
        </div>
        <div class="data-item">
          <span class="di-label">Avg. Response Time</span>
          <span class="di-value"><span class="num-counter">< 24</span> Hours</span>
        </div>
        <div class="data-item">
          <span class="di-label">Availability</span>
          <span class="di-value" style="color: var(--mc-green);">Open For New Projects</span>
        </div>
      </div>
      
      <a href="https://maps.google.com/?q=eParivartan+Hyderabad" target="_blank" rel="noopener" class="btn-launch">
        Launch Navigation
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="7" y1="17" x2="17" y2="7"></line>
          <polyline points="7 7 17 7 17 17"></polyline>
        </svg>
      </a>
    </div>
    
  </div>
</section>

<script>
  /* Register ScrollTrigger */
  gsap.registerPlugin(ScrollTrigger);

  /* 1. Generate Floating Particles around Beacon */
  const pContainer = document.getElementById('particle-container');
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('div');
    p.classList.add('particle');
    pContainer.appendChild(p);
    
    // Random starting positions within a circle
    const angle = Math.random() * Math.PI * 2;
    const radius = 40 + Math.random() * 80;
    const startX = Math.cos(angle) * radius;
    const startY = Math.sin(angle) * radius;
    
    gsap.set(p, { x: startX, y: startY });
    
    // Subtle float animation
    gsap.to(p, {
      x: startX + (Math.random() * 40 - 20),
      y: startY + (Math.random() * 40 - 20),
      opacity: Math.random() * 0.8,
      duration: 3 + Math.random() * 4,
      repeat: -1,
      yoyo: true,
      ease: "sine.inOut"
    });
  }

  /* 2. Reveal Animations on Scroll */
  gsap.from('.gs-reveal', {
    y: 40,
    opacity: 0,
    duration: 1,
    stagger: 0.2,
    ease: "power3.out",
    scrollTrigger: {
      trigger: ".mission-section",
      start: "top 80%"
    }
  });

  /* 3. Counter Animation */
  ScrollTrigger.create({
    trigger: ".mc-info-panel",
    start: "top 85%",
    onEnter: () => {
      const counter = { val: 0 };
      gsap.to(counter, {
        val: 150,
        duration: 2,
        ease: "power2.out",
        onUpdate: () => {
          document.getElementById('counter-projects').textContent = Math.round(counter.val);
        }
      });
    },
    once: true
  });

  /* 4. Init Radar Map */
  function initRadarMap() {
    // Center on Hyderabad coordinates
    const map = L.map('radar-map', {
      center: [17.4317, 78.4067],
      zoom: 12,
      zoomControl: false,
      dragging: false,
      touchZoom: false,
      scrollWheelZoom: false,
      doubleClickZoom: false,
      boxZoom: false,
      keyboard: false
    });

    // Premium minimal tiles (CartoDB Positron)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '' // Keep clean for mission control UI
    }).addTo(map);
  }
  
  // Initialize map when DOM is ready
  window.addEventListener('DOMContentLoaded', initRadarMap);
</script>

</body>
</html>
