<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPS Tracking — eParivartan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<!-- GSAP for timeline animations -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/TextPlugin.min.js"></script>

<style>
/* ═══════════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════════ */
:root {
  --bg:           #fafcfa;
  --surface:      #ffffff;
  --green:        #2d9e52;
  --green-dark:   #1f7a3f;
  --green-glow:   rgba(45, 158, 82, 0.25);
  --green-light:  rgba(45, 158, 82, 0.08);
  
  --ink:          #0f172a;
  --ink-2:        #334155;
  --ink-3:        #64748b;
  --ink-4:        #94a3b8;
  
  --glass:        rgba(255, 255, 255, 0.75);
  --border:       rgba(45, 158, 82, 0.12);
  --border-2:     rgba(15, 23, 42, 0.06);
  --shadow-lg:    0 24px 60px -12px rgba(15, 23, 42, 0.08);
  --shadow-sm:    0 4px 12px -4px rgba(15, 23, 42, 0.04);
  
  --font-sans:    'Inter', -apple-system, sans-serif;
  --font-mono:    'JetBrains Mono', monospace;
  --ease-spring:  cubic-bezier(0.34, 1.15, 0.64, 1);
}

/* ═══════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════ */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--ink);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ═══════════════════════════════════════════
   SECTION LAYOUT
═══════════════════════════════════════════ */
.gps-section {
  position: relative;
  min-height: 100vh;
  padding: 80px 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  background-image: 
    radial-gradient(circle at 80% 20%, var(--green-light) 0%, transparent 40%),
    radial-gradient(circle at 20% 80%, rgba(15, 23, 42, 0.02) 0%, transparent 40%);
}

.dashboard-container {
  display: flex;
  width: 100%;
  max-width: 1200px;
  background: var(--glass);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--surface);
  border-radius: 24px;
  box-shadow: var(--shadow-lg), inset 0 0 0 1px rgba(255,255,255,0.5);
  overflow: hidden;
  position: relative;
}

/* ═══════════════════════════════════════════
   LEFT PANEL: TERMINAL / INFO
═══════════════════════════════════════════ */
.panel-left {
  flex: 0 0 450px;
  padding: 48px;
  border-right: 1px solid var(--border-2);
  display: flex;
  flex-direction: column;
  background: linear-gradient(135deg, rgba(255,255,255,1), rgba(255,255,255,0.4));
  position: relative;
  z-index: 2;
}

.brand-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--green);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 40px;
}
.brand-badge .dot {
  width: 8px; height: 8px;
  background: var(--green);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--green-glow);
  animation: blink 2s infinite;
}
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

/* Terminal Console Area */
.terminal-block {
  margin-bottom: 40px;
  min-height: 80px;
}
.term-line {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  color: var(--ink-3);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.term-line.active {
  color: var(--ink);
  font-weight: 500;
}
.term-line.success {
  color: var(--green);
  font-weight: 600;
}
.term-icon {
  font-size: 1rem;
}

/* Data Grid */
.data-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin-bottom: 48px;
}
.data-item {
  opacity: 0; /* Hidden initially for GSAP */
  transform: translateY(10px);
}
.data-item.full {
  grid-column: 1 / -1;
}
.data-label {
  font-size: 0.75rem;
  color: var(--ink-4);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
}
.data-value {
  font-family: var(--font-mono);
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--ink);
}
.data-value.highlight {
  color: var(--green);
  font-size: 1.25rem;
}
.val-loading {
  color: var(--ink-4);
  font-style: italic;
  font-weight: 400;
  font-size: 0.9rem;
}

/* CTA */
.btn-nav {
  margin-top: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  background: var(--ink);
  color: #fff;
  padding: 18px 24px;
  border-radius: 12px;
  font-size: 0.95rem;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.3s var(--ease-spring);
  opacity: 0; /* Hidden initially */
  pointer-events: none;
}
.btn-nav.show {
  opacity: 1;
  pointer-events: auto;
}
.btn-nav:hover {
  background: var(--green);
  transform: translateY(-2px);
  box-shadow: 0 12px 24px var(--green-glow);
}
.btn-nav svg { transition: transform 0.3s var(--ease-spring); }
.btn-nav:hover svg { transform: translateX(4px); }

/* ═══════════════════════════════════════════
   RIGHT PANEL: MAP UI
═══════════════════════════════════════════ */
.panel-right {
  flex: 1;
  position: relative;
  background: #f1f5f9;
  overflow: hidden;
}

/* Subtle topological map / grid background */
.topo-grid {
  position: absolute;
  inset: 0;
  background-image: 
    linear-gradient(rgba(15,23,42,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(15,23,42,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  background-position: center;
  z-index: 1;
  opacity: 0; /* Faded in via GSAP */
}

/* Route SVG Container */
.route-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  pointer-events: none;
}
.path-line {
  fill: none;
  stroke: var(--green);
  stroke-width: 3;
  stroke-dasharray: 600;
  stroke-dashoffset: 600;
  filter: drop-shadow(0 0 6px var(--green-glow));
}
.path-glow {
  fill: none;
  stroke: var(--green-glow);
  stroke-width: 12;
  stroke-dasharray: 600;
  stroke-dashoffset: 600;
  filter: blur(4px);
}

/* GPS Marker for HQ */
.gps-marker {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0);
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: center;
}
.marker-core {
  width: 20px; height: 20px;
  background: var(--green);
  border: 3px solid #fff;
  border-radius: 50%;
  box-shadow: 0 0 16px var(--green-glow);
  position: relative;
  z-index: 2;
}
.marker-pulse {
  position: absolute;
  width: 100%; height: 100%;
  border: 2px solid var(--green);
  border-radius: 50%;
  animation: gpsPulse 2s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
  z-index: 1;
}
@keyframes gpsPulse {
  0% { transform: scale(1); opacity: 1; }
  100% { transform: scale(5); opacity: 0; border-width: 0.5px; }
}

.marker-label {
  position: absolute;
  top: -40px;
  background: var(--surface);
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 0.75rem;
  font-weight: 600;
  padding: 6px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  white-space: nowrap;
  opacity: 0;
}

/* Start Marker */
.start-marker {
  position: absolute;
  top: 80%; left: 10%;
  width: 12px; height: 12px;
  background: var(--ink-3);
  border: 2px solid #fff;
  border-radius: 50%;
  transform: translate(-50%, -50%) scale(0);
  z-index: 3;
}

/* ═══════════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════════ */
@media (max-width: 900px) {
  .dashboard-container { flex-direction: column; }
  .panel-left { flex: none; border-right: none; border-bottom: 1px solid var(--border-2); padding: 32px; }
  .panel-right { min-height: 400px; }
}
@media (max-width: 600px) {
  .gps-section { padding: 40px 20px; }
  .data-grid { grid-template-columns: 1fr; gap: 16px; }
}
</style>
</head>
<body>

<section class="gps-section">
  <div class="dashboard-container">
    
    <!-- LEFT PANEL -->
    <div class="panel-left">
      <div class="brand-badge">
        <div class="dot"></div>
        GPS Telemetry
      </div>
      
      <div class="terminal-block">
        <div class="term-line" id="term-1">
          <span class="term-icon">⟳</span>
          <span class="term-text">Initializing tracking module...</span>
        </div>
        <div class="term-line" id="term-2" style="display:none;">
          <span class="term-icon">⌖</span>
          <span class="term-text">Scanning coordinates...</span>
        </div>
        <div class="term-line" id="term-3" style="display:none;">
          <span class="term-icon">✓</span>
          <span class="term-text">Connection established.</span>
        </div>
      </div>
      
      <div class="data-grid">
        <div class="data-item d1">
          <div class="data-label">Latitude</div>
          <div class="data-value">17.3850 N</div>
        </div>
        <div class="data-item d2">
          <div class="data-label">Longitude</div>
          <div class="data-value">78.4867 E</div>
        </div>
        <div class="data-item full d3">
          <div class="data-label">Destination Found</div>
          <div class="data-value highlight">eParivartan HQ</div>
        </div>
        <div class="data-item full d4">
          <div class="data-label">Distance from Origin</div>
          <div class="data-value" id="dist-calc">
            <span class="val-loading">Calculating route...</span>
          </div>
        </div>
      </div>
      
      <a href="https://maps.google.com/?q=eParivartan+Hyderabad" target="_blank" rel="noopener" class="btn-nav" id="btn-nav">
        Start Navigation
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
        </svg>
      </a>
    </div>
    
    <!-- RIGHT PANEL -->
    <div class="panel-right">
      <div class="topo-grid"></div>
      
      <svg class="route-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
        <!-- SVG Path from bottom-left to center -->
        <path class="path-glow" d="M100,800 Q300,750 400,600 T500,500"></path>
        <path class="path-line" d="M100,800 Q300,750 400,600 T500,500"></path>
      </svg>
      
      <div class="start-marker" id="start-marker"></div>
      
      <div class="gps-marker" id="hq-marker">
        <div class="marker-pulse"></div>
        <div class="marker-core"></div>
        <div class="marker-label">HQ Target Lock</div>
      </div>
      
    </div>
    
  </div>
</section>

<script>
  gsap.registerPlugin(ScrollTrigger, TextPlugin);

  // Master Timeline for GPS Dashboard
  const tl = gsap.timeline({
    scrollTrigger: {
      trigger: ".dashboard-container",
      start: "top 80%",
    }
  });

  // 1. Initial State
  tl.set('.topo-grid', { opacity: 0 })
    .set('.path-line', { strokeDashoffset: 600 })
    .set('.path-glow', { strokeDashoffset: 600 });

  // 2. Terminal Sequence
  // Line 1: Searching
  tl.to('#term-1 .term-text', { duration: 1, text: "Searching target location...", ease: "none" })
    .to('#term-1', { color: 'var(--ink)', fontWeight: 500 }, "+=0.2");
  
  // Line 2: Scanning
  tl.set('#term-2', { display: 'flex', opacity: 0 })
    .to('#term-2', { opacity: 1, duration: 0.2 })
    .to('.topo-grid', { opacity: 1, duration: 1 }, "<") // Fade in grid
    .to('#start-marker', { scale: 1, duration: 0.5, ease: "back.out(1.7)" }, "<") // Pop start marker
    .to('#term-2 .term-text', { duration: 1, text: "Scanning coordinates [17.3850, 78.4867]", ease: "none" })
    .to('#term-2', { color: 'var(--ink)', fontWeight: 500 }, "+=0.2");

  // Line 3: Connected
  tl.set('#term-3', { display: 'flex', opacity: 0 })
    .to('#term-3', { opacity: 1, duration: 0.2 })
    .to('#term-3', { color: 'var(--green)', fontWeight: 600, duration: 0.3 })
    
  // 3. Reveal Data Items Sequentially
  tl.to('.data-item.d1', { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" })
    .to('.data-item.d2', { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, "-=0.2")
    
  // 4. Map Target Lock
  tl.to('#hq-marker', { scale: 1, duration: 0.6, ease: "back.out(2)" })
    .to('.data-item.d3', { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, "<")
    .to('.marker-label', { y: -10, opacity: 1, duration: 0.4 }, "-=0.2");

  // 5. Route Generation
  tl.to('.data-item.d4', { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" })
    .to('.path-line', { strokeDashoffset: 0, duration: 1.5, ease: "power2.inOut" })
    .to('.path-glow', { strokeDashoffset: 0, duration: 1.5, ease: "power2.inOut" }, "<");

  // 6. Distance Calculation & CTA
  tl.to('#dist-calc', { 
      duration: 1, 
      text: { value: "14.2 km <span style='font-size:0.8rem;color:var(--ink-4);font-weight:400;'>Via Outer Ring Road</span>" }, 
      ease: "none" 
    })
    .to('#btn-nav', { opacity: 1, y: -5, duration: 0.5, className: "+=btn-nav show", ease: "back.out(1.5)" });

</script>
</body>
</html>
